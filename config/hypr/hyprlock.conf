general {
    disable_loading_bar = true
    hide_cursor = true
    on_start = pamixer -m 
    on_end = pamixer -u
}

background {
    monitor =
    color = rgb(0, 0, 0)          # Solid pitch black canvas
}

input-field {
    monitor =
    size = 220, 45
    outline_thickness = 1          # Matches your 1px window/bar borders
    dots_size = 0.25               # Small password dot sizing
    dots_spacing = 0.35 
    dots_center = true

    # Color Mapping (Strict monochrome)
    outer_color = rgb(255, 255, 255)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(255, 255, 255)
    
    # Sharp rectangular edges
    rounding = 0
    
    # Interactive Prompts
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff" font_family="JetBrainsMono Nerd Font">ENTER PASSWORD</span>
    hide_input = false
    
    position = 0, -60
    halign = center
    valign = center
}

# Clean, Monospaced Clock Module
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 54
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 60
    halign = center
    valign = center
}
